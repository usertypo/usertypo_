window.__spaPageInit = function() {
            var TIME_AMOUNTS = [15, 30, 60];
            var WORD_AMOUNTS = [10, 25, 50];
            var lbState = {
                scope: 'global',
                timeframe: 'alltime',
                mode: 'time',
                amount: 30,
                countryCode: null,
            };
            var lbRequestId = 0;
            var countryCache = null;
            var countryModalOpen = false;

            function amountsForMode(mode) {
                return mode === 'words' ? WORD_AMOUNTS : TIME_AMOUNTS;
            }

            function defaultAmountForMode(mode) {
                return mode === 'words' ? 25 : 30;
            }

            function amountUnitLabel(mode) {
                return mode === 'words' ? 'words' : 'seconds';
            }

            function formatBoardFilterLabel(mode, amount) {
                if (mode === 'words') return amount + ' words';
                return 'timed ' + amount + 's';
            }

            function syncAmountButtons() {
                var amounts = amountsForMode(lbState.mode);
                var unit = amountUnitLabel(lbState.mode);
                var selectedIndex = amounts.indexOf(lbState.amount);
                if (selectedIndex < 0) {
                    lbState.amount = defaultAmountForMode(lbState.mode);
                    selectedIndex = amounts.indexOf(lbState.amount);
                }
                amounts.forEach(function (amt, index) {
                    var btn = document.getElementById('cfg-amt-' + index);
                    if (!btn) return;
                    var valEl = btn.querySelector('.amt-val');
                    var labelEl = btn.querySelector('.opt-label');
                    if (valEl) valEl.textContent = String(amt);
                    if (labelEl) labelEl.textContent = unit;
                    btn.classList.remove('text-primary', 'font-bold', 'text-slate-400');
                    btn.querySelectorAll('.drop-shadow-\\[0_0_5px_rgba\\(0\\,208\\,255\\,0\\.4\\)\\]').forEach(function (s) {
                        s.classList.remove('drop-shadow-[0_0_5px_rgba(0,208,255,0.4)]');
                    });
                    if (index === selectedIndex) {
                        btn.classList.add('text-primary', 'font-bold');
                        if (valEl) valEl.classList.add('drop-shadow-[0_0_5px_rgba(0,208,255,0.4)]');
                        if (labelEl) labelEl.classList.add('drop-shadow-[0_0_5px_rgba(0,208,255,0.4)]');
                    } else {
                        btn.classList.add('text-slate-400');
                        if (valEl) valEl.classList.remove('drop-shadow-[0_0_5px_rgba(0,208,255,0.4)]');
                        if (labelEl) labelEl.classList.remove('drop-shadow-[0_0_5px_rgba(0,208,255,0.4)]');
                    }
                });
            }

            function getCurrentUserId() {
                if (!window.usertypoAuth) return null;
                try {
                    var state = window.usertypoAuth.getState();
                    return state.isSignedIn && state.user ? state.user.id : null;
                } catch (e) {
                    return null;
                }
            }

            function escapeHtml(value) {
                if (window.usertypoEscape && typeof window.usertypoEscape.html === 'function') {
                    return window.usertypoEscape.html(value);
                }
                return String(value == null ? '' : value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function setStatus(text) {
                var el = document.getElementById('lb-status');
                if (el) el.textContent = text;
            }

            function setActive(selector, clickedEl) {
                if (!clickedEl) return;
                document.querySelectorAll(selector).forEach(function (b) {
                    b.classList.remove('text-primary', 'font-bold');
                    b.classList.add('text-slate-400');
                    b.querySelectorAll('.drop-shadow-\\[0_0_5px_rgba\\(0\\,208\\,255\\,0\\.4\\)\\]').forEach(function (s) {
                        s.classList.remove('drop-shadow-[0_0_5px_rgba(0,208,255,0.4)]');
                    });
                });
                clickedEl.classList.add('text-primary', 'font-bold');
                clickedEl.classList.remove('text-slate-400');
            }

            function forceAlltimeTime30() {
                lbState.timeframe = 'alltime';
                lbState.mode = 'time';
                lbState.amount = 30;
                var alltimeBtn = document.getElementById('cfg-alltime');
                var modeTimeBtn = document.getElementById('cfg-mode-time');
                if (alltimeBtn) setActive('.is-time', alltimeBtn);
                if (modeTimeBtn) setActive('.is-mode', modeTimeBtn);
                syncAmountButtons();
            }

            function renderAvatar(entry, colorClass, isMe) {
                if (window.usertypoPlayerAvatar) {
                    return window.usertypoPlayerAvatar.fromPlayer({
                        avatarUrl: entry.avatarUrl,
                        name: entry.username,
                        level: entry.level,
                        percentToNext: entry.percentToNext,
                        userId: entry.userId,
                    }, {
                        size: 'xs',
                        className: isMe ? 'lb-avatar-glow' : '',
                    });
                }
                var lb = window.usertypoLeaderboards;
                var letter = escapeHtml(lb ? lb.initialFor(entry.username) : '?');
                var safeAvatar = window.usertypoEscape && typeof window.usertypoEscape.url === 'function'
                    ? window.usertypoEscape.url(entry.avatarUrl, '')
                    : '';
                if (safeAvatar) {
                    return '<div class="w-7 h-7 rounded-full ' + colorClass + ' flex items-center justify-center overflow-hidden border border-transparent' + (isMe ? ' lb-avatar-glow' : '') + '">' +
                        '<img src="' + escapeHtml(safeAvatar) + '" alt="" class="w-full h-full object-cover" loading="lazy" />' +
                        '</div>';
                }
                return '<div class="w-7 h-7 rounded-full ' + colorClass + ' flex items-center justify-center font-sans font-bold text-xs' + (isMe ? ' lb-avatar-glow' : ' border border-transparent group-hover:border-white/10 transition-colors') + '">' + letter + '</div>';
            }

            function renderFlag(entry) {
                if (!entry || !entry.countryCode || !window.usertypoLeaderboards) return '';
                if (typeof window.usertypoLeaderboards.flagHtml === 'function') {
                    return window.usertypoLeaderboards.flagHtml(entry.countryCode, { className: 'lb-user-flag' });
                }
                return '';
            }

            function renderLoading() {
                var tbody = document.getElementById('lb-tbody');
                if (!tbody) return;
                tbody.innerHTML = '<tr><td colspan="7" class="py-10 px-5 text-center text-slate-500 text-sm">Loading leaderboard...</td></tr>';
            }

            function renderMessage(message) {
                var tbody = document.getElementById('lb-tbody');
                if (!tbody) return;
                tbody.innerHTML = '<tr><td colspan="7" class="py-10 px-5 text-center text-slate-500 text-sm">' + escapeHtml(message) + '</td></tr>';
            }

            function renderTable(entries, myUserId) {
                var tbody = document.getElementById('lb-tbody');
                var lb = window.usertypoLeaderboards;
                if (!tbody || !lb) return;

                if (!entries.length) {
                    renderMessage('No scores yet for this filter. Complete an English test to appear here.');
                    return;
                }

                tbody.innerHTML = entries.map(function (entry, index) {
                    var isMe = !!(myUserId && entry.userId === myUserId);
                    var colorClass = isMe ? 'bg-primary text-background-dark' : lb.colorClassForIndex(index);
                    var rank = escapeHtml(lb.formatRank(entry.rank));
                    var wpm = escapeHtml(lb.formatWpm ? lb.formatWpm(entry.wpm) : String(Math.round(entry.wpm)));
                    var raw = escapeHtml(lb.formatWpm ? lb.formatWpm(entry.rawWpm) : '—');
                    var acc = escapeHtml(lb.formatAccuracy(entry.accuracy));
                    var cons = escapeHtml(lb.formatConsistency ? lb.formatConsistency(entry.consistency) : lb.formatAccuracy(entry.consistency));
                    var date = escapeHtml(lb.formatRelativeTime(entry.createdAt));
                    var username = escapeHtml(entry.username || 'Player');
                    var flag = renderFlag(entry);

                    var nameBlock = '<span class="inline-flex items-center gap-1.5 min-w-0">' +
                        '<span class="font-sans tracking-wide truncate ' +
                        (isMe ? 'font-bold lb-text-strong' : 'font-medium lb-name-hover transition-colors') +
                        '">' + username + '</span>' +
                        flag +
                        (isMe ? '<span class="material-symbols-outlined text-primary text-sm shrink-0" title="You">person</span>' : '') +
                        '</span>';

                    if (isMe) {
                        return '<tr class="lb-row-me group">' +
                            '<td class="py-2.5 px-5 font-bold text-primary">' + rank + '</td>' +
                            '<td class="py-2.5 px-5"><div class="flex items-center gap-2.5 min-w-0">' +
                            renderAvatar(entry, colorClass, true) +
                            nameBlock +
                            '</div></td>' +
                            '<td class="py-2.5 px-5 text-right font-bold lb-text-strong text-base">' + wpm + '</td>' +
                            '<td class="py-2.5 px-4 text-right lb-text-strong-80 hidden md:table-cell">' + raw + '</td>' +
                            '<td class="py-2.5 px-5 text-right lb-text-strong font-medium">' + acc + '</td>' +
                            '<td class="py-2.5 px-4 text-right lb-text-strong-80 hidden md:table-cell">' + cons + '</td>' +
                            '<td class="py-2.5 px-5 text-right text-primary/70 hidden sm:table-cell">' + date + '</td>' +
                            '</tr>';
                    }

                    return '<tr class="group">' +
                        '<td class="py-2.5 px-5 text-slate-400">' + rank + '</td>' +
                        '<td class="py-2.5 px-5"><div class="flex items-center gap-2.5 min-w-0">' +
                        renderAvatar(entry, colorClass, false) +
                        nameBlock +
                        '</div></td>' +
                        '<td class="py-2.5 px-5 text-right font-bold text-primary/80">' + wpm + '</td>' +
                        '<td class="py-2.5 px-4 text-right text-slate-400 hidden md:table-cell">' + raw + '</td>' +
                        '<td class="py-2.5 px-5 text-right text-slate-300">' + acc + '</td>' +
                        '<td class="py-2.5 px-4 text-right text-slate-400 hidden md:table-cell">' + cons + '</td>' +
                        '<td class="py-2.5 px-5 text-right text-slate-500 hidden sm:table-cell">' + date + '</td>' +
                        '</tr>';
                }).join('');
            }

            function countryLabel(code) {
                var lb = window.usertypoLeaderboards;
                if (!lb || !code) return code || '';
                return lb.countryName(code) || code;
            }

            async function ensureCountries() {
                if (countryCache) return countryCache;
                if (!window.usertypoLeaderboards || typeof window.usertypoLeaderboards.listLeaderboardCountries !== 'function') {
                    return [];
                }
                countryCache = await window.usertypoLeaderboards.listLeaderboardCountries();
                return countryCache;
            }

            async function resolveDefaultCountry() {
                var countries = await ensureCountries();
                if (!countries.length) return null;
                try {
                    if (window.usertypoProfiles && typeof window.usertypoProfiles.getMyProfile === 'function') {
                        var profile = await window.usertypoProfiles.getMyProfile();
                        var mine = window.usertypoLeaderboards.normalizeCountryCode(profile && profile.country_code);
                        if (mine && countries.some(function (c) { return c.code === mine; })) {
                            return mine;
                        }
                    }
                } catch (e) { /* ignore */ }
                return countries[0].code;
            }

            function closeCountryModal() {
                var modal = document.getElementById('lb-country-modal');
                if (!modal) return;
                modal.classList.remove('is-open');
                modal.setAttribute('aria-hidden', 'true');
                countryModalOpen = false;
            }

            function renderCountryList(filterText) {
                var list = document.getElementById('lb-country-list');
                if (!list) return;
                var q = String(filterText || '').trim().toLowerCase();
                var rows = (countryCache || []).filter(function (c) {
                    if (!q) return true;
                    return (
                        (c.name && c.name.toLowerCase().indexOf(q) !== -1)
                        || (c.code && c.code.toLowerCase().indexOf(q) !== -1)
                    );
                });
                if (!rows.length) {
                    list.innerHTML = '<p class="text-xs text-slate-500 text-center py-8 px-2">No matching countries.</p>';
                    return;
                }
                list.innerHTML = rows.map(function (c) {
                    var selected = c.code === lbState.countryCode ? ' is-selected' : '';
                    var usersLabel = c.users === 1 ? '1 player' : (c.users + ' players');
                    var flag = window.usertypoLeaderboards && typeof window.usertypoLeaderboards.flagHtml === 'function'
                        ? window.usertypoLeaderboards.flagHtml(c.code, { className: 'lb-country-flag' })
                        : '';
                    return '<button type="button" class="lb-country-row' + selected + '" data-country="' +
                        escapeHtml(c.code) + '" role="option" aria-selected="' +
                        (c.code === lbState.countryCode ? 'true' : 'false') + '">' +
                        flag +
                        '<span class="lb-country-meta">' +
                        '<span class="lb-country-name">' + escapeHtml(c.name || c.code) + '</span>' +
                        '<span class="lb-country-users">' + escapeHtml(c.code) + ' · ' + escapeHtml(usersLabel) + '</span>' +
                        '</span></button>';
                }).join('');
            }

            async function openCountryModal() {
                var modal = document.getElementById('lb-country-modal');
                var search = document.getElementById('lb-country-search');
                if (!modal) return;
                try {
                    await ensureCountries();
                } catch (err) {
                    console.error('[usertypo leaderboards] countries failed', err);
                    setStatus('Could not load countries.');
                    return;
                }
                if (search) search.value = '';
                renderCountryList('');
                modal.classList.add('is-open');
                modal.setAttribute('aria-hidden', 'false');
                countryModalOpen = true;
                if (search) setTimeout(function () { search.focus(); }, 50);
            }

            async function loadLeaderboard() {
                if (!window.usertypoLeaderboards) {
                    renderMessage('Leaderboard module is not loaded.');
                    return;
                }

                var reqId = ++lbRequestId;
                setStatus('Loading leaderboard...');
                renderLoading();

                try {
                    if (window.usertypoAuth && typeof window.usertypoAuth.ready === 'function') {
                        await window.usertypoAuth.ready();
                    }

                    var result;
                    if (lbState.scope === 'country') {
                        forceAlltimeTime30();
                        if (!lbState.countryCode) {
                            lbState.countryCode = await resolveDefaultCountry();
                        }
                        if (!lbState.countryCode) {
                            if (reqId !== lbRequestId) return;
                            setStatus('No countries with players yet.');
                            renderMessage('No players have a country set yet. Complete a test while signed in to record yours.');
                            openCountryModal();
                            return;
                        }
                        result = await window.usertypoLeaderboards.getLeaderboard({
                            scope: 'country',
                            countryCode: lbState.countryCode,
                            mode: 'time',
                            amount: 30,
                            timeframe: 'alltime',
                            limit: 50,
                        });
                        if (reqId !== lbRequestId) return;
                        setStatus('All-time English timed 30s · ' + countryLabel(lbState.countryCode));
                        renderTable(result.entries, getCurrentUserId());
                        return;
                    }

                    if (lbState.scope === 'friends') {
                        forceAlltimeTime30();
                        if (!getCurrentUserId()) {
                            if (reqId !== lbRequestId) return;
                            setStatus('Sign in to see friends leaderboards.');
                            renderMessage('Sign in to view the friends leaderboard.');
                            return;
                        }
                        result = await window.usertypoLeaderboards.getLeaderboard({
                            scope: 'friends',
                            mode: 'time',
                            amount: 30,
                            timeframe: 'alltime',
                            limit: 50,
                        });
                        if (reqId !== lbRequestId) return;
                        setStatus('All-time English timed 30s · Friends');
                        if (!result.entries.length) {
                            renderMessage('No friend scores yet. Add friends and complete all-time qualifying 30s tests.');
                            return;
                        }
                        renderTable(result.entries, getCurrentUserId());
                        return;
                    }

                    result = await window.usertypoLeaderboards.getLeaderboard({
                        mode: lbState.mode,
                        amount: lbState.amount,
                        timeframe: lbState.timeframe,
                        limit: 50,
                    });
                    if (reqId !== lbRequestId) return;
                    var labels = { daily: 'Daily', weekly: 'Weekly', alltime: 'All-time' };
                    setStatus(
                        (labels[lbState.timeframe] || 'All-time') +
                        ' English ' +
                        formatBoardFilterLabel(lbState.mode, lbState.amount) +
                        ' leaderboard'
                    );
                    renderTable(result.entries, getCurrentUserId());
                } catch (err) {
                    if (reqId !== lbRequestId) return;
                    console.error('[usertypo leaderboards] load failed', err);
                    var msg = (err && (err.message || err.code)) || '';
                    if (String(msg).indexOf('guest') !== -1 || String(msg).indexOf('not_authenticated') !== -1) {
                        setStatus('Sign in to see friends leaderboards.');
                        renderMessage('Sign in to view the friends leaderboard.');
                        return;
                    }
                    setStatus('Could not load leaderboard.');
                    renderMessage('Could not load leaderboard. Please refresh and try again.');
                }
            }

            function setScope(v, el) {
                setActive('.is-scope', el);
                lbState.scope = v;
                if (v === 'country') {
                    forceAlltimeTime30();
                    loadLeaderboard().then(function () { openCountryModal(); });
                    return;
                }
                if (v === 'friends') forceAlltimeTime30();
                closeCountryModal();
                loadLeaderboard();
            }
            function setTime(v, el) {
                if (lbState.scope === 'country' || lbState.scope === 'friends') {
                    forceAlltimeTime30();
                    return;
                }
                setActive('.is-time', el);
                lbState.timeframe = v;
                loadLeaderboard();
            }
            function setMode(v, el) {
                if (lbState.scope === 'country' || lbState.scope === 'friends') {
                    forceAlltimeTime30();
                    return;
                }
                setActive('.is-mode', el);
                lbState.mode = v === 'words' ? 'words' : 'time';
                lbState.amount = defaultAmountForMode(lbState.mode);
                syncAmountButtons();
                loadLeaderboard();
            }
            function setDurIndex(index, el) {
                if (lbState.scope === 'country' || lbState.scope === 'friends') {
                    forceAlltimeTime30();
                    return;
                }
                var amounts = amountsForMode(lbState.mode);
                var idx = Math.max(0, Math.min(amounts.length - 1, Number(index) || 0));
                lbState.amount = amounts[idx];
                if (el) setActive('.is-dur', el);
                else syncAmountButtons();
                loadLeaderboard();
            }

            window.setScope = setScope;
            window.setTime = setTime;
            window.setMode = setMode;
            window.setDurIndex = setDurIndex;

            try {
                var params = new URLSearchParams(window.location.search || '');
                var wantedScope = params.get('scope') || sessionStorage.getItem('usertypo_lb_scope');
                sessionStorage.removeItem('usertypo_lb_scope');
                if (wantedScope === 'friends' || wantedScope === 'country' || wantedScope === 'global') {
                    lbState.scope = wantedScope;
                    var scopeBtn = document.getElementById('cfg-' + wantedScope);
                    if (scopeBtn) setActive('.is-scope', scopeBtn);
                }
                var wantedCountry = params.get('country') || sessionStorage.getItem('usertypo_lb_country');
                sessionStorage.removeItem('usertypo_lb_country');
                if (wantedCountry && window.usertypoLeaderboards) {
                    lbState.countryCode = window.usertypoLeaderboards.normalizeCountryCode(wantedCountry);
                }
            } catch (e) { /* ignore */ }

            syncAmountButtons();
            loadLeaderboard();
            if (lbState.scope === 'country') openCountryModal();

            const configBar = document.getElementById('config-bar');
            if (configBar) {
                configBar.classList.add('is-open');
                setTimeout(function () { configBar.classList.remove('is-open'); }, 2000);
            }

            const innerConfigContent = document.getElementById('inner-config-content');
            let configExpandTimer = null;
            if (configBar) {
                configBar.addEventListener('mouseenter', function () {
                    clearTimeout(configExpandTimer);
                    configExpandTimer = setTimeout(function () {
                        if (innerConfigContent) innerConfigContent.style.pointerEvents = 'auto';
                    }, 500);
                });
                configBar.addEventListener('mouseleave', function () {
                    clearTimeout(configExpandTimer);
                    if (innerConfigContent) innerConfigContent.style.pointerEvents = 'none';
                });
            }

            var countryClose = document.getElementById('lb-country-close');
            var countrySearch = document.getElementById('lb-country-search');
            var countryList = document.getElementById('lb-country-list');
            var countryModal = document.getElementById('lb-country-modal');
            if (countryClose) countryClose.addEventListener('click', closeCountryModal, { signal: __pageSignal });
            if (countrySearch) {
                countrySearch.addEventListener('input', function () {
                    renderCountryList(countrySearch.value);
                }, { signal: __pageSignal });
            }
            if (countryList) {
                countryList.addEventListener('click', function (e) {
                    var btn = e.target.closest('[data-country]');
                    if (!btn) return;
                    lbState.countryCode = btn.getAttribute('data-country');
                    closeCountryModal();
                    loadLeaderboard();
                }, { signal: __pageSignal });
            }
            if (countryModal) {
                countryModal.addEventListener('click', function (e) {
                    if (e.target === countryModal) closeCountryModal();
                }, { signal: __pageSignal });
            }
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && countryModalOpen) closeCountryModal();
            }, { signal: __pageSignal });

            var cfgCountry = document.getElementById('cfg-country');
            if (cfgCountry) {
                cfgCountry.addEventListener('click', function () {
                    if (lbState.scope === 'country') openCountryModal();
                }, { signal: __pageSignal });
            }

            const pageTrack = document.getElementById('page-scroll-track');
            const pageThumb = document.getElementById('page-scroll-thumb');
            let isDragging = false, startY, startScrollTop;

            function updatePageScrollbar() {
                if (!pageTrack || !pageThumb) return;
                const docH = document.documentElement.scrollHeight;
                const winH = window.innerHeight;
                const scrollable = docH - winH;
                if (scrollable <= 0) { pageTrack.style.display = 'none'; return; }
                pageTrack.style.display = 'block';
                const pct = window.scrollY / scrollable;
                const trackH = pageTrack.clientHeight;
                const thumbH = Math.max(trackH * (winH / docH), 40);
                pageThumb.style.height = thumbH + 'px';
                pageThumb.style.top = (pct * (trackH - thumbH)) + 'px';
            }

            document.addEventListener('mousemove', function (e) {
                if (!pageTrack) return;
                if (isDragging || window.innerWidth - e.clientX < 40) {
                    pageTrack.classList.remove('opacity-0', 'translate-x-4', 'pointer-events-none');
                    pageTrack.classList.add('opacity-100', 'translate-x-0', 'pointer-events-auto');
                } else {
                    pageTrack.classList.add('opacity-0', 'translate-x-4', 'pointer-events-none');
                    pageTrack.classList.remove('opacity-100', 'translate-x-0', 'pointer-events-auto');
                }
            });

            window.addEventListener('scroll', updatePageScrollbar);
            window.addEventListener('resize', updatePageScrollbar);

            if (pageThumb) {
                pageThumb.addEventListener('mousedown', function (e) {
                    isDragging = true;
                    startY = e.clientY;
                    startScrollTop = window.scrollY;
                    document.body.style.userSelect = 'none';
                    pageThumb.classList.add('bg-primary');
                });
            }
            document.addEventListener('mousemove', function (e) {
                if (!isDragging || !pageTrack || !pageThumb) return;
                const docH = document.documentElement.scrollHeight;
                const winH = window.innerHeight;
                const maxScroll = docH - winH;
                const thumbH = pageThumb.clientHeight;
                const maxThumbTop = pageTrack.clientHeight - thumbH;
                const deltaY = e.clientY - startY;
                window.scrollTo(0, startScrollTop + (deltaY / maxThumbTop) * maxScroll);
            });
            document.addEventListener('mouseup', function () {
                if (!isDragging) return;
                isDragging = false;
                document.body.style.userSelect = '';
                if (pageThumb) pageThumb.classList.remove('bg-primary');
            });

            window.addEventListener('keydown', function (e) {
                if (e.key === ' ' || e.key === 'Spacebar') {
                    const activeEl = document.activeElement;
                    if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable)) {
                        return;
                    }
                    e.preventDefault();
                }
            });

            setTimeout(updatePageScrollbar, 100);
};

var __prevSpaCleanup = window.__spaPageCleanup;
window.__spaPageCleanup = function() {
    __pageAbort.abort();
    __pageTimers.forEach(function(t) {
        if (t.kind === 'interval') __origClearInterval(t.id);
        else __origClearTimeout(t.id);
    });
    document.addEventListener = __origDocAEL;
    window.addEventListener = __origWinAEL;
    window.setInterval = __origSetInterval;
    window.setTimeout = __origSetTimeout;
    if (typeof __prevSpaCleanup === 'function') {
        try { __prevSpaCleanup(); } catch (e) {}
    }
};

</script>
