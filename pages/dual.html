<style>
#app-views {
            font-size: clamp(13px, 1.3032vw, 24px);
        }

        /* --- USER CARET --- */
        #caret {
            position: absolute;
            transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1), width 0.2s cubic-bezier(0.2, 0, 0.2, 1), opacity 0.5s ease-in-out;
            will-change: transform, width, opacity;
            pointer-events: none;
            left: 0;
            top: 0;
            z-index: 10;
            height: 1.2em;
        }

        #caret::after {
            content: '';
            position: absolute;
            bottom: -2.5px;
            left: 0;
            right: 0;
            height: 2.5px;
            background-color: #00d0ff;
            border-radius: 9999px;
        }

        /* --- BOT (OPPONENT) GHOST CARET --- */
        #bot-caret {
            position: absolute;
            will-change: transform, width, opacity;
            pointer-events: none;
            left: 0;
            top: 0;
            z-index: 9;
            height: 1.2em;
            display: none;
        }

        /* --- TEXT CONTAINER --- */
        #text-container {
            display: flex;
            flex-wrap: wrap;
            row-gap: 0.25em;
            column-gap: 0.6em;
            align-content: flex-start;
            transition: filter 0.3s ease-in-out, opacity 0.5s ease-in-out, transform 0.25s cubic-bezier(0.2, 0, 0.2, 1);
            padding: 10px;
            margin: -10px;
        }

        .word { white-space: nowrap; }

        .char.error-underline {
            text-decoration: underline;
            text-decoration-color: #ff3333;
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
            text-decoration-skip-ink: none;
        }

        .test-box-outer {
            width: 88vw;
            max-width: none !important;
        }

        /* Fixed header clearance + flexible tail; test-box only grows downward */
        #test-view {
            min-height: calc(100dvh - 4.5rem);
        }
        #dual-test-main {
            min-height: calc(100dvh - 4.5rem - 4rem);
        }
        #dual-layout-spacer-top {
            flex: 0 0 auto;
            flex-shrink: 0;
            min-height: clamp(10rem, 22vh, 16rem);
            width: 100%;
        }
        #dual-layout-spacer-bottom {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
        }

        /* Keymap on: page scroll only — footer stays pinned via test-view flex column */
        #app-body.keymap-scrollable {
            overflow-y: auto !important;
            height: auto !important;
            min-height: 100vh;
        }

        /* Proportional desktop scaling for typing test (matches home page) */
        #typing-area {
            font-size: clamp(32px, 2.4vw, 43.2px) !important;
            line-height: 1.5 !important;
            padding-left: 16px;
            padding-right: 16px;
        }

        /* --- STATS VIEW --- */
        @keyframes statsCardIn {
            0% { opacity: 0; transform: translateY(18px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes dualPillGlow {
            0%, 100% { box-shadow: 0 0 8px rgba(var(--theme-primary-rgb, 0, 208, 255), calc(0.35 * var(--glow-intensity, 1))); }
            50% { box-shadow: 0 0 18px rgba(var(--theme-primary-rgb, 0, 208, 255), calc(0.6 * var(--glow-intensity, 1))); }
        }
        /* Page scroll on body — do not clamp stats into a non-scrolling flex box */
        #stats-view {
            overflow: visible;
            flex: 1 0 auto;
            min-height: auto;
            height: auto;
        }
        #stats-view > main {
            width: 100%;
            max-width: min(64rem, 100%);
            min-height: auto;
            padding-left: clamp(1rem, 4vw, 2rem);
            padding-right: clamp(1rem, 4vw, 2rem);
            padding-bottom: clamp(2.5rem, 8vh, 4rem);
            padding-top: clamp(1.25rem, 4vh, 2.5rem);
            gap: clamp(1.25rem, 3.5vh, 2rem);
            box-sizing: border-box;
            justify-content: flex-start;
        }
        #dual-stats-compare {
            gap: 0;
            width: 100%;
            min-width: 0;
        }
        #dual-stats-compare > .dual-stats-player {
            min-width: 0;
            padding-left: clamp(0.25rem, 1.5vw, 1.5rem);
            padding-right: clamp(0.25rem, 1.5vw, 1.5rem);
            transition: opacity 0.35s ease, filter 0.35s ease;
        }
        #dual-stats-compare > .dual-stats-player.is-opponent-left {
            opacity: 0.38;
            filter: grayscale(0.55);
            pointer-events: none;
        }
        .dual-stats-winner-glow {
            background: radial-gradient(circle, rgba(var(--theme-primary-rgb), 0.18) 0%, transparent 70%);
        }
        .dual-stats-avatar-glow {
            box-shadow: 0 0 16px rgba(var(--theme-primary-rgb), 0.3);
        }
        #dual-stats-compare > .dual-stats-player.is-opponent-left .dual-stats-avatar-wrap::after {
            content: 'Left';
            position: absolute;
            left: 50%;
            bottom: -0.15rem;
            transform: translateX(-50%);
            z-index: 20;
            font-size: 0.55rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgb(248 113 113);
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(248, 113, 113, 0.35);
            border-radius: 999px;
            padding: 0.1rem 0.4rem;
            pointer-events: none;
        }
        #dual-stats-compare .dual-stats-avatar-wrap {
            margin-bottom: clamp(0.85rem, 2vh, 1.35rem);
            /* Grow avatar via --pla-size, not transform:scale (scale breaks level badge). */
            transform: none;
        }
        #dual-stats-compare .player-level-avatar {
            --pla-size: 5.25rem;
            --pla-photo: 74%;
            --pla-stroke: 2.1;
            --pla-badge-min: 1.2rem;
            --pla-badge-h: 1.2rem;
            --pla-badge-px: 0.3rem;
            --pla-badge-font: 0.5rem;
            --pla-initial-font: 1.15rem;
            --pla-bot-font: 1.65rem;
        }
        #dual-stats-compare .player-level-avatar__level {
            bottom: -0.2rem;
            font-size: 0.5rem;
            min-width: 1.15rem;
            height: 1.15rem;
            line-height: 1.15rem;
            padding: 0 0.28rem;
        }
        @media (min-width: 640px) {
            #dual-stats-compare .player-level-avatar {
                --pla-size: 6rem;
                --pla-badge-min: 1.25rem;
                --pla-badge-h: 1.25rem;
                --pla-badge-font: 0.533rem;
            }
            #dual-stats-compare .player-level-avatar__level {
                min-width: 1.25rem;
                height: 1.25rem;
                line-height: 1.25rem;
                font-size: 0.533rem;
            }
        }
        @media (min-width: 1024px) {
            #dual-stats-compare .player-level-avatar {
                --pla-size: 6.75rem;
            }
        }
        #dual-stats-compare .dual-stats-name {
            max-width: 100%;
            font-size: clamp(0.7rem, 2.2vw, 0.875rem);
            margin-bottom: clamp(0.4rem, 1.2vh, 0.75rem);
        }
        #dual-stats-compare .dual-stats-metrics {
            width: 100%;
            max-width: min(16rem, 100%);
            gap: clamp(0.15rem, 1vw, 0.5rem);
        }
        #dual-stats-compare .dual-stats-metrics .dual-metric-label {
            font-size: clamp(0.5rem, 1.6vw, 0.5625rem);
        }
        #dual-stats-compare .dual-stats-metrics .dual-metric-side {
            font-size: clamp(0.85rem, 2.8vw, 1.125rem);
        }
        #dual-stats-compare .dual-stats-metrics .dual-metric-wpm {
            font-size: clamp(1.5rem, 6vw, 2.25rem);
        }
        #dual-stats-graph-card {
            width: 100%;
            min-width: 0;
            height: clamp(18rem, 46vh, 24rem);
            min-height: 16rem;
            display: flex;
            flex-direction: column;
            margin-top: clamp(1.75rem, 5vh, 3rem);
        }
        @media (max-height: 720px) {
            #dual-stats-graph-card {
                height: clamp(15rem, 42vh, 20rem);
                margin-top: clamp(1.25rem, 4vh, 2rem);
            }
        }
        @media (max-height: 560px) and (orientation: landscape) {
            #dual-stats-graph-card {
                height: clamp(12rem, 52vh, 16rem);
                margin-top: clamp(1rem, 3vh, 1.5rem);
            }
        }
        #dual-graph-container {
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
            min-height: 12rem;
            min-width: 0;
            flex: 1 1 auto;
            position: relative;
        }
        #dual-graph-container::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }
        #dual-graph-tooltip {
            background: var(--theme-menu-bg, rgba(68, 68, 68, 0.4)) !important;
            background-image: none !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
        }
        .dual-graph-tab-pill {
            display: inline-flex;
            width: auto;
            max-width: 100%;
            background: var(--theme-menu-bg, rgba(68, 68, 68, 0.4));
            background-image: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 9999px;
            padding: 3px;
            gap: 2px;
            position: relative;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .dual-graph-tab-pill button {
            position: relative;
            z-index: 2;
            flex: 0 1 auto;
            min-width: 0;
            padding: 0.35rem clamp(0.75rem, 2.5vw, 1.25rem);
            border-radius: 9999px;
            border: none;
            background: transparent;
            color: #64748b;
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.62rem, 2vw, 0.75rem);
            font-weight: 600;
            letter-spacing: .04em;
            cursor: pointer;
            transition: color .3s ease;
            overflow: visible;
            white-space: nowrap;
        }
        .dual-graph-tab-pill button.active {
            color: var(--theme-fg-strong, #fff);
        }
        .dual-graph-pill-indicator {
            position: absolute;
            top: 3px;
            height: calc(100% - 6px);
            border-radius: 9999px;
            background: rgba(var(--theme-primary-rgb, 0, 208, 255), 0.18);
            border: 1px solid rgba(var(--theme-primary-rgb, 0, 208, 255), 0.5);
            box-shadow: 0 0 10px rgba(var(--theme-primary-rgb, 0, 208, 255), calc(0.25 * var(--glow-intensity, 1)));
            transition: left .35s cubic-bezier(0.16, 1, 0.3, 1), width .35s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            animation: dualPillGlow 3s ease infinite;
        }
        #stats-action-buttons {
            flex-wrap: wrap;
            gap: clamp(0.65rem, 2vw, 1.25rem);
            padding-inline: 0.25rem;
        }
        #stats-action-buttons #rematch-btn {
            padding: clamp(0.65rem, 1.5vh, 0.75rem) clamp(1.25rem, 4vw, 2.5rem);
            font-size: clamp(0.8rem, 2.4vw, 1rem);
        }
        #stats-action-buttons #leave-dual-btn {
            padding: clamp(0.55rem, 1.2vh, 0.65rem) clamp(1rem, 3vw, 1.75rem);
            font-size: clamp(0.7rem, 2.1vw, 0.875rem);
        }
        @media (max-width: 420px) {
            #stats-action-buttons #leave-dual-btn .dual-leave-shortcut {

</style>

<script>
(function () {
    'use strict';

    let controller = null;

    window.usertypo_testRuntime = {
        isActive: function () { return !!(controller && controller.isActive()); },
        isTyping: function () { return !!(controller && controller.isTyping()); },
    };

    window.__spaPageInit = async function () {
        if (!window.usertypoDualPage) {
            if (typeof window.navigateTo === 'function') window.navigateTo('/friends');
            return;
        }
        controller = window.usertypoDualPage.createController();
        window.usertypoDualPage.refreshKeymap = function () {
            if (controller && typeof controller.refreshKeymap === 'function') {
                controller.refreshKeymap();
            }
        };
        await controller.init();
        window.usertypoDualPage.refreshKeymap();
    };

    window.__spaPageCleanup = function () {
        if (controller) controller.cleanup();
        controller = null;
        if (window.usertypoDualPage) window.usertypoDualPage.refreshKeymap = null;
        window.usertypo_testRuntime = null;
        if (typeof window.usertypo_unlockStatsScroll === 'function') {
            window.usertypo_unlockStatsScroll();
        }
    };
})();
</script>
