<style type="text/css">
    .otl-page {
        font-family: 'Inter', sans-serif;
        width: 100%;
        max-width: 28rem;
        margin: 0 auto;
        padding: 3rem 1rem;
        color: var(--theme-text, #e2e8f0);
        text-align: center;
    }
    .otl-page h1 {
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        font-size: 1.35rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
    }
    .otl-muted {
        color: var(--theme-text-muted, #94a3b8);
        font-size: 0.9rem;
        line-height: 1.5;
    }
    .otl-error {
        color: #f87171;
        font-size: 0.9rem;
        margin-top: 1rem;
    }
</style>

<div class="otl-page" id="otl-root">
    <h1>Signing you in…</h1>
    <p class="otl-muted" id="otl-status">Please wait while we open this one-time link.</p>
    <p class="otl-error hidden" id="otl-error"></p>
</div>

<script>
(function () {
    function $(id) { return document.getElementById(id); }

    function codeFromLocation() {
        try {
            var params = new URLSearchParams(window.location.search || '');
            var fromQuery = String(params.get('c') || '').trim();
            if (fromQuery) return fromQuery;
            var m = String(window.location.pathname || '').match(/^\/go\/([A-Za-z0-9]{8,32})\/?$/);
            return m ? m[1] : '';
        } catch (e) {
            return '';
        }
    }

    function adminWorkerUrl() {
        var cfg = (window.USERTYPO_CONFIG && window.USERTYPO_CONFIG.admin) || {};
        return String(cfg.url || '').replace(/\/+$/, '');
    }

    async function redeem(code) {
        var base = adminWorkerUrl();
        if (!base) throw new Error('admin_worker_not_configured');
        var res = await fetch(base + '/go/' + encodeURIComponent(code) + '/redeem', {
            method: 'POST',
            headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
            body: '{}',
        });
        var data = null;
        try { data = await res.json(); } catch (_) { data = null; }
        if (!res.ok) {
            throw new Error((data && data.error) || ('redeem_failed_' + res.status));
        }
        if (!data || !data.token) throw new Error('token_missing');
        return data;
    }

    async function signInWithTicket(ticket) {
        if (!window.usertypoAuth || typeof window.usertypoAuth.ready !== 'function') {
            throw new Error('auth_not_ready');
        }
        await window.usertypoAuth.ready();
        var clerk = window.Clerk;
        if (!clerk || !clerk.client || !clerk.client.signIn) throw new Error('clerk_not_ready');

        if (clerk.session) {
            try {
                if (typeof clerk.session.end === 'function') await clerk.session.end();
                else await clerk.signOut(function () { /* stay */ });
            } catch (e) {
                try { await clerk.signOut(function () { /* stay */ }); } catch (e2) { /* ignore */ }
            }
            await new Promise(function (r) { setTimeout(r, 300); });
        }

        var signIn = await clerk.client.signIn.create({
            strategy: 'ticket',
            ticket: ticket,
        });
        if (!signIn || !signIn.createdSessionId) throw new Error('ticket_sign_in_failed');
        await clerk.setActive({ session: signIn.createdSessionId });
        if (!clerk.user) throw new Error('session_inactive');
    }

    async function boot() {
        var status = $('otl-status');
        var errEl = $('otl-error');
        var code = codeFromLocation();
        if (!code) {
            if (status) status.textContent = '';
            if (errEl) {
                errEl.textContent = 'This sign-in link is missing or invalid.';
                errEl.classList.remove('hidden');
            }
            return;
        }
        try {
            var data = await redeem(code);
            if (status) status.textContent = 'Finishing sign-in…';
            await signInWithTicket(data.token);
            if (status) status.textContent = 'Signed in. Taking you home…';
            if (typeof window.navigateTo === 'function') window.navigateTo('/');
            else window.location.assign('/');
        } catch (err) {
            var msg = (err && err.message) || 'Could not use this link';
            if (msg === 'link_used') msg = 'This link was already used.';
            if (msg === 'link_expired') msg = 'This link has expired. Ask for a new one.';
            if (msg === 'link_not_found') msg = 'This sign-in link was not found.';
            if (status) status.textContent = '';
            if (errEl) {
                errEl.textContent = msg;
                errEl.classList.remove('hidden');
            }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
    } else {
        boot();
    }
})();
</script>
