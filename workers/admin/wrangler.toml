# usertypo_ Admin Worker — moderation, reports, dwell, impersonation.
# Deploy: npm run worker:admin:deploy:dev  /  npm run worker:admin:deploy:prod
# Secrets: CLERK_SECRET_KEY, SUPABASE_SERVICE_ROLE_KEY

name = "usertypo-admin-dev"
main = "src/index.ts"
compatibility_date = "2026-07-27"

[vars]
ENVIRONMENT = "dev"
PUBLIC_SITE_URL = "https://dev.usertypo.com"
ALLOWED_ORIGINS = "https://dev.usertypo.com,https://dev.usertypo.pages.dev,http://localhost:3000,http://127.0.0.1:3000"
CLERK_AUTHORIZED_PARTIES = "https://dev.usertypo.com,https://dev.usertypo.pages.dev,http://localhost:3000,http://127.0.0.1:3000"
CLERK_FRONTEND_API = "trusted-prawn-31.clerk.accounts.dev"
ADMIN_PUBLIC_IDS = "I9000RBN,0KTJ6BFW,EW7MDS87"
SUPABASE_URL = "https://dzpbkyqsshdruwhffwhw.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6cGJreXFzc2hkcnV3aGZmd2h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5Nzg5NDMsImV4cCI6MjEwMzU1NDk0M30.xeBQz3lc7FukiptPcEl4cDsBD16aCatYytk7vWsWmEM"

[[d1_databases]]
binding = "NOTIFICATIONS_DB"
database_name = "usertypo-notifications-dev"
database_id = "d00364f9-9a87-4354-84ce-4d183974b53a"

[env.production]
